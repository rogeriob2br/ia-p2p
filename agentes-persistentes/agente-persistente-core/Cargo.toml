[package]
name = "agente-persistente-core"
version = "0.1.0"
edition = "2021"
authors = ["Rogério <rogerio@local>"]
description = "Core Engine do Agente Cognitivo Persistente com Identidade Emergente, Homeostase Econômica, Dever e Legado."

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
sysinfo = "0.30"
atty = "0.2.14"
