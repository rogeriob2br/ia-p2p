[package]
name = "p2p-core"
version = "0.1.0"
edition = "2021"
description = "Core P2P networking library for decentralized AI network"

[dependencies]
libp2p = { version = "0.53", features = [
    "gossipsub",
    "request-response",
    "mdns",
    "tcp",
    "noise",
    "yamux",
    "tokio",
    "macros",
    "identify",
] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
futures = "0.3"
async-trait = "0.1"
hex = "0.4"

