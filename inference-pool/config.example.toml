# Inference Pool Configuration Example
# Copy this file to config.toml and adjust values as needed

[pool]
pool_id = "pool-001"
name = "My Inference Pool"
description = "Decentralized AI inference pool for LangChain and CrewAI integration"
operator = "Pool Operator Name"
contact_email = "operator@example.com"
version = "0.1.0"

[api]
listen_addr = "0.0.0.0:8080"
tls_enabled = false
# tls_cert_path = "/path/to/cert.pem"
# tls_key_path = "/path/to/key.pem"
max_connections = 10000
request_timeout_ms = 300000  # 5 minutes
cors_enabled = true
cors_origins = []  # Empty = all origins allowed

[p2p]
enabled = true
listen_addrs = ["/ip4/0.0.0.0/tcp/9000"]
bootstrap_nodes = []
orchestration_topic = "/pool/orchestration/1.0.0"
heartbeat_topic = "/pool/heartbeat/1.0.0"

[auth]
enabled = true
key_prefix = "sk-pool-"
default_rate_limit_rpm = 60
default_tokens_per_day = 1000000
admin_keys = []  # Add admin API keys here

[registry]
max_members = 1000
heartbeat_interval_ms = 30000   # 30 seconds
heartbeat_timeout_ms = 90000    # 90 seconds
max_missed_heartbeats = 3
auto_deregister = true
min_success_rate = 0.90         # 90%
unhealthy_threshold_hours = 48

[router]
default_strategy = "weighted_score"  # Options: round_robin, least_loaded, lowest_latency, weighted_score, context_aware
max_retries = 3
retry_delay_ms = 1000
job_timeout_ms = 120000  # 2 minutes
use_network_map = true
load_weight = 0.3
latency_weight = 0.3
success_weight = 0.4

[billing]
enabled = true
base_fee_per_1k_tokens = 0.001  # USD
default_currency = "USD"
pool_fee_percent = 10.0
billing_period_hours = 720      # 30 days
instant_payments = true

[lightning]
enabled = false  # Enable when Lightning node is configured
backend = "mock"  # Options: lnd, cln, mock
host = "localhost"
port = 10009
# macaroon_path = "/path/to/admin.macaroon"
# tls_cert_path = "/path/to/tls.cert"
default_channel_capacity_sats = 1000000   # 0.01 BTC
min_local_balance_sats = 100000           # 0.001 BTC
auto_rebalance = true

[logging]
level = "info"      # Options: trace, debug, info, warn, error
format = "pretty"   # Options: json, pretty
file_enabled = false
# file_path = "/var/log/inference-pool/pool.log"







